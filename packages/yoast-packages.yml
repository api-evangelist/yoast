method: searched
source: >-
  registry.npmjs.org, repo.packagist.org and github.com/Yoast, queried
  unauthenticated on 2026-08-13
note: >-
  Yoast ships two very different families of package. The FIRST family is the
  JavaScript analysis + UI stack that the Yoast SEO plugin itself is built from and
  which third parties reuse to embed Yoast's content analysis (yoastseo, @yoast/*).
  The SECOND family is PHP: the plugin distributions themselves plus Yoast's widely
  reused developer tooling (yoast/phpunit-polyfills alone has 46M+ Composer installs).
  The only packages that are true API CLIENTS — the MyYoast provisioning clients — are
  published as git repositories rather than to a registry, so they carry version: null
  with a note; a consumer pinning them is pinning a git ref, not a release.
packages:
  # --- MyYoast Provisioning API clients (the only first-party API SDKs) ---
  - language: php
    registry: git
    name: yoast/subscription-api-php-client
    url: https://github.com/Yoast/subscription-api-php-client
    install: 'composer require yoast/subscription-api-php-client:*@dev  # via VCS repository entry'
    official: true
    version: null
    published: null
    api: MyYoast Provisioning API
    note: >-
      Checked and absent from Packagist (repo.packagist.org returns 404). Yoast's own
      README instructs installation via a composer "repositories" VCS entry pointing at
      the GitHub repo with constraint "*@dev", so the distribution is unpinned and floats
      to the default branch. Swagger Codegen output; declares API version 1.0.0.
  - language: javascript
    registry: git
    name: subscription-api-javascript-client
    url: https://github.com/Yoast/subscription-api-javascript-client
    install: 'npm install Yoast/subscription-api-javascript-client --save'
    official: true
    version: null
    published: null
    api: MyYoast Provisioning API
    note: >-
      Checked and absent from npm under both the plausible names. The README explicitly
      tells consumers to publish it themselves or install from git, so there is no
      published release to date. Swagger Codegen output; declares package version 1.0.0.

