note: >-
  Yoast publishes NO first-party MCP server. Searched the developer portal, the Yoast
  GitHub org, yoast.com/llms.txt and the public MCP directories; every Yoast SEO "MCP
  server" that turns up is third-party (Easy MCP AI, miniOrange Secure MCP Server,
  Novamira, Pipedream) and runs on the customer's own WordPress install, not on Yoast
  infrastructure. Yoast's own agent-facing bet is the WordPress Abilities API instead:
  since Yoast SEO 27.5 it registers three read-only abilities that any MCP bridge on the
  site can expose. That is a real agent surface, but it is not an MCP server Yoast
  operates, so this artifact stays a derived candidate. The tools below are a candidate
  projection of the OpenAPI operations in this repo; nobody ships them.
deployment:
  mode: none
  auth: unknown
  verified: searched
server:
  name: yoast
  transport: null
  url: null
tools:
  # --- Yoast SEO REST API, on the customer's WordPress host ---
  - name: get_seo_head
    description: Get all SEO metadata (meta tags, Schema.org JSON-LD, canonical, robots, OG, Twitter) for a URL
    source_operation: openapi/yoast-seo-head-api-openapi.yml#getSeoHead
  - name: list_posts_with_seo
    description: List WordPress posts with Yoast SEO metadata appended
    source_operation: openapi/yoast-posts-api-openapi.yml#listPostsWithSeo
  - name: get_post_with_seo
    description: Get a single WordPress post with Yoast SEO metadata
    source_operation: openapi/yoast-posts-api-openapi.yml#getPostWithSeo
  - name: list_pages_with_seo
    description: List WordPress pages with Yoast SEO metadata appended
    source_operation: openapi/yoast-pages-api-openapi.yml#listPagesWithSeo
  - name: get_page_with_seo
    description: Get a single WordPress page with Yoast SEO metadata
    source_operation: openapi/yoast-pages-api-openapi.yml#getPageWithSeo
  # --- Yoast SEO Abilities API (WordPress 6.9 Abilities), on the customer's WordPress host ---
  - name: list_abilities
    description: List the abilities registered on the site, optionally filtered to category yoast-seo
    source_operation: openapi/yoast-abilities-api-openapi.yml#listAbilities
  - name: get_seo_scores
    description: Get the SEO analysis score and focus keyphrase of the most recently modified posts
    source_operation: openapi/yoast-abilities-api-openapi.yml#runGetSeoScores
  - name: get_readability_scores
    description: Get the readability analysis score of the most recently modified posts
    source_operation: openapi/yoast-abilities-api-openapi.yml#runGetReadabilityScores
  - name: get_inclusive_language_scores
    description: Get the inclusive language analysis score of the most recently modified posts
    source_operation: openapi/yoast-abilities-api-openapi.yml#runGetInclusiveLanguageScores
  # --- Schema Aggregator, on the customer's WordPress host ---
  - name: get_aggregated_schema
    description: Get the aggregated Schema.org graph for a post type as JSON-L
    source_operation: openapi/yoast-schema-aggregator-openapi.yml#getAggregatedSchema
  - name: get_aggregated_schema_page
    description: Get one page of the aggregated Schema.org graph for a post type
    source_operation: openapi/yoast-schema-aggregator-openapi.yml#getAggregatedSchemaPage
  - name: get_schema_map
    description: Get the XML schemamap listing every aggregated-schema endpoint on the site
    source_operation: openapi/yoast-schema-aggregator-openapi.yml#getSchemaMap
  # --- MyYoast Provisioning API, on my.yoast.com (partner credentials required) ---
  - name: create_subscription
    description: Create a Yoast subscription for a customer
    source_operation: openapi/yoast-myyoast-provisioning-openapi.yml#subscriptionProvisioningControllerCreate
  - name: get_subscription
    description: Get a single provisioned subscription
