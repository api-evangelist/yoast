  - name: refund_subscription
    description: Refund a subscription
    source_operation: openapi/yoast-myyoast-provisioning-openapi.yml#subscriptionProvisioningControllerRefundSubscription
  - name: set_subscription_site
    description: Link a subscription to a customer website
    source_operation: openapi/yoast-myyoast-provisioning-openapi.yml#subscriptionProvisioningControllerSetSiteForSubscription
  - name: get_current_product_version
    description: Get the latest version and download URLs offered for a product code
