note: >-
  Yoast publishes its editor UI as reusable React packages on npm under the @yoast scope.
  These are the components that render the Yoast metabox, the Google/social snippet
  previews, the replacement-variable editor and the analysis result lists — the surfaces
  a WordPress user actually touches — and they are consumed by page builders and headless
  editors that want the Yoast experience outside the Yoast metabox. They are NOT SDKs:
  they call no Yoast-hosted API. Note the currency split: the presentation packages
  (ui-library, snippet previews, replacement-variable editor) shipped stable releases in
  March 2026, while the older components/analysis-report/helpers/style-guide line has
  been sitting on 2025 alpha prereleases as its latest published tag.
