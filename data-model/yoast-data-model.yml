  - name: SeoMetadata
    domain: content
    id_field: null
    source: openapi/_original/yoast-rest-openapi.yml#/components/schemas/SeoMetadata
    description: >-
      The structured SEO payload Yoast attaches to every indexable object — title,
      description, canonical, robots directives, the Open Graph set, the Twitter Card
      set, article timestamps, author, and the Schema.org graph. This is the single most
      reused schema in the Yoast surface.
    fields:
      - title
      - description
      - canonical
      - robots
      - og_locale
      - og_type
      - og_title
      - og_description
      - og_url
      - og_site_name
      - og_image[]
      - twitter_card
      - twitter_title
      - twitter_description
      - twitter_image
      - article_published_time
      - article_modified_time
      - author
      - schema
  - name: SeoHeadResponse
    domain: content
    id_field: null
    source: openapi/yoast-seo-head-api-openapi.yml#/components/schemas/SeoHeadResponse
    fields:
      - html
      - json
      - status
  - name: AnalysisScore
    domain: content
    id_field: null
    source: openapi/yoast-abilities-api-openapi.yml#/components/schemas/AnalysisScore
    description: >-
      A per-post analysis result returned by the Abilities API. Keyed only by post
      TITLE, not by post id — which is the notable modelling weakness on Yoast's
      agent-facing surface, because an agent cannot reliably join a score back to the
      post it came from.
    fields:
      - title
      - score
      - label
  - name: SeoScore
    domain: content
    extends: AnalysisScore
    source: openapi/yoast-abilities-api-openapi.yml#/components/schemas/SeoScore
    fields:
      - focus_keyphrase
  - name: SchemaGraph
    domain: content
    id_field: null
    source: openapi/yoast-schema-aggregator-openapi.yml#getAggregatedSchema
    description: >-
      One Schema.org @graph per line of JSON-L, aggregated over a post type. The Schema
      pieces Yoast emits (Organization, WebSite, WebPage, Article, BreadcrumbList,
      Person, Product, Offer, Review, Question, HowTo, Recipe, Video, Event,
      LocalBusiness, PostalAddress, Comment, Image, SearchAction, ProductGroup,
      AggregateOffer) are documented individually at developer.yoast.com/features/schema/pieces/.
  - name: Subscription
    domain: commerce
    id_field: iD
    id_type: string
    source: openapi/yoast-myyoast-provisioning-openapi.yml#/components/schemas/SubscriptionProvisioningResponseDto
