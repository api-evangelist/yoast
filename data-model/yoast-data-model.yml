id_domains:
  - entity: Post
    format: WordPress integer post ID; unique per site, meaningless across sites
  - entity: Subscription
    format: opaque string; a separate human-facing subscriptionNumber is also returned
  - entity: ProductVersion
    format: product slug plus a productCode used at creation time
gaps:
  - >-
    No identifier joins the commerce domain to the content domain; siteUrl is a string.
  - >-
    The Abilities API returns scores keyed by post title rather than post id, so an agent
    cannot deterministically map a score to a post.
  - >-
    Subscription.startDate and endDate are integers (Unix timestamps) while every content
    timestamp is an ISO 8601 string — two time conventions in one provider.
