source: openapi/ in this repo
note: >-
  Derived from the $ref graph and id-reference fields across the six OpenAPIs in this
  repo. Two disjoint models exist and never touch each other: the CONTENT model on the
  customer's WordPress install (posts and pages carrying a Yoast SEO metadata object,
  plus the aggregated Schema.org graph), and the COMMERCE model on my.yoast.com
  (subscriptions, products, sites). There is no identifier that joins them — a
  subscription's siteUrl is a URL string, not a handle on anything the content APIs
  expose — so a consumer cannot ask "what is the SEO state of the site this subscription
  paid for" through the published contracts.
domains:
  - name: content
    host: "https://{site}/wp-json"
    owner: customer WordPress install
  - name: commerce
    host: https://my.yoast.com
    owner: Yoast
entities:
  - name: Post
    domain: content
