apis:
- aid: yoast:yoast-surfaces-api
  name: Yoast Surfaces API
  description: >-
    The Yoast Surfaces API provides a PHP interface for retrieving SEO metadata programmatically within
    WordPress. It exposes the YoastSEO() surface with methods to get metadata for the current page, a
    specific post by ID, or a given URL. Returns titles, descriptions, Schema arrays, canonical URLs,
    robots directives, OpenGraph, and Twitter card data.
  humanURL: https://developer.yoast.com/customization/apis/surfaces-api/
  baseURL: https://{your-site}
  tags:
  - SEO
  - PHP API
  - Metadata
  - WordPress
  properties:
  - type: Documentation
    url: https://developer.yoast.com/customization/apis/surfaces-api/
- aid: yoast:yoast-metadata-api
  name: Yoast Metadata API
  description: >-
    The Yoast Metadata API provides a PHP interface to add, alter, or remove metadata in the <head> of
    a WordPress document. Developers can hook into Yoast's meta tag output pipeline to customize titles,
    descriptions, robots directives, Open Graph tags, and other head elements programmatically.
  humanURL: https://developer.yoast.com/customization/apis/metadata-api/
  baseURL: https://{your-site}
  tags:
  - SEO
  - PHP API
  - Metadata
  - WordPress
  properties:
  - type: Documentation
    url: https://developer.yoast.com/customization/apis/metadata-api/
- aid: yoast:yoast-schema-api
  name: Yoast Schema API
  description: >-
    The Yoast Schema API provides a PHP interface for customizing the Schema.org JSON-LD structured data
    output generated by Yoast SEO. Developers can add, remove, or modify schema pieces such as Organization,
    WebSite, Article, BreadcrumbList, and more to control how search engines interpret page content.
  humanURL: https://developer.yoast.com/customization/apis/schema-api/
  baseURL: https://{your-site}
  tags:
  - SEO
  - Schema.org
  - Structured Data
  - PHP API
  - WordPress
  properties:
  - type: Documentation
    url: https://developer.yoast.com/customization/apis/schema-api/
