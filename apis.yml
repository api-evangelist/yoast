aid: yoast
name: Yoast
description: >-
  Yoast is the maker of the world's most popular WordPress SEO plugin, active on over 13 million sites, and is part of
  Newfold Digital. Yoast provides developer APIs for integrating SEO metadata, structured data (Schema.org), meta tags,
  sitemaps, and SEO analysis into headless WordPress sites and third-party platforms. Most of that surface ships as
  plugin code and runs on the customer's own WordPress install: the Yoast REST API (/wp-json/yoast/v1/get_head plus
  yoast_head_json on WP posts and pages), the Schema Aggregator API that emits a site's whole Schema.org graph as
  JSON-L, the Surfaces, Metadata and Schema PHP APIs, and — since Yoast SEO 27.5 — three read-only WordPress Abilities
  that hand SEO, readability and inclusive-language scores to AI agents. Yoast additionally operates one hosted API of
  its own, the MyYoast Provisioning (Subscription) API at my.yoast.com, a partner-gated Basic Auth surface for
  resellers, backed by an OpenID Connect issuer with dynamic client registration, PKCE and DPoP. Key products include
  Yoast SEO Free, Yoast SEO Premium, Yoast SEO for Shopify, WooCommerce SEO, Local SEO, Video SEO, and News SEO.
