- aid: yoast:myyoast-provisioning-api
  name: MyYoast Provisioning API
  description: >-
    The MyYoast Provisioning API (also called the Subscription API) is the one API Yoast hosts itself. It lets an
    approved Yoast provisioning partner create, read, renew, cancel, refund and site-link Yoast product subscriptions
    on behalf of their customers, retrieve the current plugin version and download URLs for a product code, schedule a
    GDPR delete for a customer, and rotate their own provisioner Basic Auth password. Credentials are issued by Yoast
    to provisioners only.
  humanURL: https://developer.yoast.com/customization/myyoast/apis/subscription-api/
