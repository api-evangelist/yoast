- aid: yoast:yoast-abilities-api
  name: Yoast SEO Abilities API
  description: >-
    Yoast SEO registers its content-analysis results as WordPress Abilities (the Abilities API introduced in
    WordPress 6.9), making them discoverable and executable over the WordPress REST API by AI agents and third-party
    systems. Three read-only abilities — yoast-seo/get-seo-scores, yoast-seo/get-readability-scores and
    yoast-seo/get-inclusive-language-scores — return the analysis scores of the most recently modified posts.
  humanURL: https://developer.yoast.com/features/yoast-seo-abilities/overview/
